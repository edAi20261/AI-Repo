# Behavioural configuration. Committed; no secrets (those live in .env).
# Overlays under `environments:` are merged on top, selected by APP_ENV.

llm:
  # Default chat model. Provider + model move the whole system.
  provider: openrouter           # anthropic | openai | google | azure | local | openrouter
  model: google/gemini-2.5-flash
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 60
  max_retries: 3
  # Native structured output (json_schema) — TIED TO THE MODEL / in `overrides`. No probing:
  # true only for a model whose json_schema output is known to validate; false = the safe universal
  # path (one plain call + tolerant extract_json), zero wasted calls. VERIFIED: gemini-2.5-flash and
  # gemini-2.5-flash-lite via OpenRouter DO support it -> true. (Kimi did NOT — set false if you switch
  # back.) Revisit this line whenever you change the model.
  structured_output: true
  # Only route to endpoints that accept the parameters we send: OpenRouter serves
  # one model from several providers and not all enforce a schema.
  require_structured_endpoints: true
  # One retry, carrying the validation errors back. Published guidance is that a
  # third attempt signals a prompt or schema problem, not a recoverable one.
  structured_attempts: 2
  # A gateway that answers with an error body instead of a completion is not a
  # model mistake: the request goes again, unchanged, before it can fail a turn.
  provider_retries: 2
  provider_retry_delay_seconds: 0.5
  # Served in order when the endpoint above errors. Both honour json_schema
  # (see structured_output), so a fallback never costs the schema.
  fallback_models: [google/gemini-2.5-flash-lite]

  # Per-task settings merged over the block above; absent keys inherit it.
  # HOT-PATH SPLIT: light/fast gemini-2.5-flash-lite for the small nodes on the critical path of
  # every turn (plan, compose) and the small visual builders; the heavier gemini-2.5-flash only for
  # the content-generating tasks. max_tokens are sane CEILINGS (a cap, not the driver of latency)
  # sized to each task so nothing truncates.
  overrides:
    # Ingestion's two chat calls, one per book each. They follow vision onto
    # Vertex so the whole ingestion path bills to one account; everything below
    # answers students and stays on OpenRouter.
    extract_topics:  { provider: vertex, model: google/gemini-2.5-flash, temperature: 0.0 }
    derive_deps:     { provider: vertex, model: google/gemini-2.5-flash, temperature: 0.0 }
    split_lessons:   { provider: vertex, model: google/gemini-2.5-pro, temperature: 0.0, max_tokens: 32000, timeout_seconds: 600, max_retries: 1, fallback_models: [google/gemini-2.5-flash] }
    understand:      { provider: openrouter, model: google/gemini-2.5-flash, temperature: 0.0, max_tokens: 1500 }
    converse:        { provider: openrouter, model: google/gemini-2.5-flash, max_tokens: 800 }
    conversation_summary: { provider: openrouter, model: google/gemini-2.5-flash-lite, temperature: 0.0, max_tokens: 1200 }
    explain:         { provider: openrouter, model: google/gemini-2.5-flash, max_tokens: 4000 }
    summarize:       { provider: openrouter, model: google/gemini-2.5-flash, max_tokens: 4000 }
    compose:         { provider: openrouter, model: google/gemini-2.5-flash-lite, max_tokens: 2000 }
    speech:          { provider: openrouter, model: google/gemini-2.5-flash-lite, temperature: 0.0, max_tokens: 2000 }
    assessment:      { provider: openrouter, model: google/gemini-2.5-flash, temperature: 0.0, max_tokens: 4000 }
    grade:           { provider: openrouter, model: google/gemini-2.5-flash, temperature: 0.0, max_tokens: 4000 }
    report:          { provider: openrouter, model: google/gemini-2.5-flash, temperature: 0.0, max_tokens: 2000 }
    # scripts/eval_answers.py only. Deliberately a different model family from
    # the one that writes the answers: a model asked to mark its own output
    # scores it higher than a reader would, so Gemini writes and Claude marks.
    # Anthropic models served through OpenRouter reject a schema-bound request
    # in a way the OpenAI client reads as a content filter, with or without
    # json_schema — so the judge is an OpenAI model, which is a different family
    # from the Gemini that writes the answers, which is the point.
    judge:           { provider: openrouter, model: openai/gpt-4.1, temperature: 0.0, max_tokens: 1200 }
    slides:          { provider: openrouter, model: google/gemini-2.5-flash, max_tokens: 3000 }
    persona:         { provider: openrouter, model: google/gemini-2.5-flash, temperature: 0.2, max_tokens: 3000 }
    visual_mindmap:  { provider: openrouter, model: google/gemini-2.5-flash-lite, temperature: 0.0, max_tokens: 2000 }
    visual_flashcards: { provider: openrouter, model: google/gemini-2.5-flash-lite, temperature: 0.0, max_tokens: 2000 }
    visual_math:     { provider: openrouter, model: google/gemini-2.5-flash-lite, temperature: 0.0, max_tokens: 2000 }
    visual_pdf:      { provider: openrouter, model: google/gemini-2.5-flash-lite, temperature: 0.0, max_tokens: 3000 }

vision:
  # Scanned/maths transcription and figure captions. fallback_model is used when
  # the primary response cannot be parsed.
  # Ingestion is the expensive half of this service — two model calls per page
  # plus one per figure — so it has to be able to bill somewhere other than the
  # half that answers students. The transport is the same everywhere (an
  # OpenAI-shaped /chat/completions with a bearer token), so a gateway is a base
  # URL and a key, not a code path.
  # openrouter | google | openai | vertex
  #
  # google and vertex serve the same models and bill from different places:
  # google draws on AI Studio prepay credit, vertex on the Cloud billing
  # account, which is where a project's trial credit actually lives. vertex is
  # also the only one that will not take a static key — it mints an OAuth token
  # from a service account, which expires in an hour, so shared/gcp.py caches it.
  provider: vertex
  # The variable holding the key. Null means: the one this provider usually
  # uses (OPENROUTER_API_KEY, GOOGLE_API_KEY, OPENAI_API_KEY). Name it when a
  # deployment keeps its key somewhere of its own. Ignored by vertex.
  api_key_env: null
  # vertex only: the variable holding the path to the service-account JSON.
  credentials_env: GOOGLE_APPLICATION_CREDENTIALS
  # vertex only: which project and region the models are called in.
  project: null
  location: us-central1
  # Against qwen/qwen3-vl-235b-a22b-instruct, which this replaces. The earlier
  # $0.0065 here came from a short prompt and was not what a page costs; these
  # are the tokens Vertex reported for the shipped prompt at 300 dpi, priced at
  # list, over twelve pages of an external English book:
  #   qwen via openrouter      $0.01270/page   ~60s a call
  #   gemini flash via vertex  $0.00493/page   12.6s a call   (3,783 in, 722-3,308 out)
  #   gemini pro via vertex    $0.02577/page   19.8s a call   <- the fallback below
  # Vertex reports no cost field, so a run's own metered figure reads $0.00 and
  # the bill has to come from the tokens or from Cloud Billing.
  # The fallback is 5.2x flash and 2x qwen, so what the swap saves depends on
  # how often a page needs it: at 5% the all-in page is $0.0062, half of qwen,
  # and it only stops being cheaper than qwen past a 30% fallback rate.
  model: google/gemini-2.5-flash
  # The standby for a page the primary cannot parse. A Gemini model, so a
  # fallback cannot quietly move the bill back to OpenRouter — which is what
  # openai/gpt-4.1 here would have done on the first unparseable page.
  fallback_model: google/gemini-2.5-pro
  # Null means: built from the project and region below. Vertex's address
  # carries both, so it is derived rather than typed out twice.
  base_url: null
  timeout_seconds: 180           # a scanned page costs one call, so this is per page
  # Gemini counts its hidden thinking against this, and on a dense Arabic page
  # it thinks ~5,000 tokens before writing ~500. At 4096 the JSON was cut off
  # mid-string and failed to parse: measured 2 of 4 pages truncated, which the
  # run then retried onto the fallback model and rate-limited itself. At 16384,
  # 0 of 4.
  max_tokens: 16384
  # How much deliberation to pay for. Measured over three dense pages, cost per
  # call and the characters transcribed:
  #   default   $0.01624   5074 thinking   1725 chars
  #   low       $0.00635    907 thinking   1707 chars   <- picked
  #   minimal   $0.00492    485 thinking   1554 chars
  # low keeps 99% of the text for 39% of the price. minimal is cheaper again
  # and loses a tenth of the words, which is not a trade worth making when the
  # job is copying a page exactly. Null leaves the provider's default.
  reasoning_effort: low
  # A 429 means "later", not "no". Three ingest tasks at eight pages each put
  # twenty-four requests against one Vertex quota, and measured over the first
  # twenty-two minutes of the external English and Science books that produced
  # seven rejections and two pages lost outright. With no retry a rejected page
  # dropped to the fallback model and, when that was limited too, was recorded
  # unreadable — and a page lost to a quota counts against needs_review_ratio
  # exactly as a blurred one does, so at 0.05 a quiet few minutes of rate
  # limiting sends a whole paid-for textbook to manual review.
  # Four attempts with a jittered 4s doubling waits out up to ~60s of limiting,
  # which is well inside the 180s a page is already allowed.
  retry_attempts: 4
  retry_backoff_seconds: 4.0

embeddings:
  # Bilingual index embedder. `hash` is a deterministic test embedder (no model).
  provider: huggingface          # huggingface | openai | cohere | voyage | hash
  model: BAAI/bge-m3
  dimensions: 1024
  batch_size: 8
  max_seq_length: 2048
  normalize: true
  warm_on_start: true

vector_store:
  timeout_seconds: 120         # the write path: a lesson's points go up in batches
  # The read path sits between a student's question and every word of the
  # answer, so it gets its own, far smaller budget. Measured against the
  # production cluster from outside it: a k=8 search over eduai_chunks runs
  # 99-100ms, k=24 the same, topics the same, with one 273ms cold outlier.
  # 5s is ~18x the worst measured call: a search that slow is broken, not busy.
  # Keep a sparse vector beside the dense one, so the lexical half of a search
  # can FIND a chunk rather than only re-rank what the dense half returned: a
  # name, a formula or a date a student types exactly is what an average over
  # 1024 dimensions loses. Terms come from the embedding model's own
  # multilingual tokenizer, so a Chinese or Hindi page is as searchable as an
  # English one.
  # Off until the collection is rebuilt — naming a vector in a query finds none
  # of the points already written without a name.
  hybrid: true
  query_timeout_seconds: 5
  upsert_batch_size: 64
  # The collection retrieval reads and ingestion writes. Named dense + sparse
  # vectors cannot be added to a collection that has an unnamed one, so the
  # hybrid index is built beside the old one and this line makes the switch —
  # and the way back, if it has to be made.
  collection: eduai_chunks_v2
  source_collection: eduai_chunks   # what scripts/reembed_chunks.py copies from
  topics_collection: eduai_topics  # topic-label vectors (resolve_topics ANN); populated on re-ingest
  distance: cosine
  # Payload fields indexed for filtering; namespace is filtered on every query.
  indexed_payload_fields:
    - namespace
    - subject_id
    - grade
    - language
    - lecture_id
    - topic_ids
    - version
    - chunk_kind          # contents pages are filtered out of retrieval
  hnsw:
    m: 16
    ef_construct: 128

ingestion:
  books:
    lesson_source: ministry_official
  source:
    timeout_seconds: 120
    max_bytes: 209715200
    chunk_bytes: 1048576
  chunk:
    target_tokens: 650
    min_tokens: 400
    max_tokens: 800
    overlap_tokens: 80
    structure_aware: true
  topics:
    min_per_lecture: 3
    max_per_lecture: 8
    max_input_tokens: 12000      # above this, extract in batches and union (0 = single call)
    reuse_threshold: 0.60        # re-ingest reuses a lecture's own topic_id above this cosine similarity
    assign_threshold: 0.45       # tag a chunk with a topic above this similarity
  dependencies:
    max_out_degree: 5            # max prerequisites kept per topic
    max_candidates: 40           # cap candidates per topic to the K nearest (0 = no cap)
    drop_self_edges: true
    break_cycles: true
  # Embed each chunk as "subject. lesson. Section: heading. Page n." + the text,
  # never the text alone: a four-word chunk names no lesson, unit or page, so a
  # query naming one has nothing in the vector to match. Measured over the 154
  # indexed chunks against scripts/eval_retrieval.json, dense only:
  #   off  precision@1 0.750  MRR 0.833  answerable/unanswerable gap +0.084
  #   on   precision@1 0.833  MRR 0.882  answerable/unanswerable gap +0.107
  # Off until the index is re-embedded — a prefixed chunk and a bare one are not
  # comparable, so a half-converted index ranks by which half a chunk is in.
  # Flip this, then run scripts/reembed_chunks.py --apply.
  context_prefix: true
  normalise:                     # NFKC + tatweel strip, before chunking
    nfkc: true
    strip_tatweel: true
    collapse_whitespace: true
  layout:
    # Parse each page into typed blocks in reading order, and let the chunker
    # group them, instead of splitting the page's text by length. Measured on a
    # 40-page magazine-style textbook: 25 chunks at a 546-token median, 4% over
    # the size limit and the copyright line welded into 25 of 25, against 52
    # chunks at a 243-token median, none oversized and none contaminated.
    # On. Chunks written by the two paths do not line up, so a lecture takes
    # the new path only when it is next ingested; the 11 already indexed keep
    # the chunks they have until someone re-ingests them deliberately.
    enabled: true
    # Which side of a column a page is read from. Detected per page from what
    # the page is written in, because one direction for a whole corpus reads
    # every Latin, Cyrillic and CJK page backwards the moment the corpus stops
    # being Arabic — and a single book can hold both. Set detect_direction
    # false to force the value below for every page.
    detect_direction: true
    reading_direction: ltr        # used only when detect_direction is false
    cache: true                   # store what a model read, keyed on model + prompt digest
    # The tier between a text layer that cannot be trusted with a page and a
    # chat model asked to transcribe it. A document layout model reads the page
    # from pixels, so scattered boxes cost it nothing, and it reports the
    # regions, their kinds and their reading order rather than prose. Off until
    # a deployment installs the model: the package and its weights are hundreds
    # of megabytes, and a deployment without them must keep ingesting.
    tier2:
      enabled: false
      # structure: small detection + recognition models, seconds a page on a
      # CPU. vl: one 0.9B vision-language model, the better reader, but
      # gigabytes of memory and minutes a page without a GPU.
      pipeline: structure       # structure | vl
      version: v1.6             # PaddleOCR-VL pipeline version, vl only
      device: cpu               # cpu | gpu:0
      language: null            # OCR language hint, e.g. ar, en, fr; null detects
      read_charts: true         # a chart becomes a table instead of a picture
      read_images: true         # the words set inside a diagram are read too
      cache: true
  # How much of a lesson has to be unreadable before it is held back from
  # retrieval. A share, not a count: any-page-failed does not scale. A 371-page
  # textbook read into 545 good chunks answered nothing, because one page came
  # back unreadable and rag_search only reads lectures marked ready — while a
  # three-page lesson with the same one bad page went through. A share also
  # needs no special case for a short lesson: one page of three is a third of it.
  needs_review_ratio: 0.05
  ocr:
    min_chars_per_page: 40       # fewer characters than this: treat page as scanned
    render_dpi: 300
    engine: vision
    # How many pages are read by a model at once. A page is seconds of
    # arithmetic and a minute of waiting on HTTP, and Fargate bills for the
    # container existing rather than working — so reading one at a time held a
    # machine for ten hours to do twenty minutes of work.
    #
    # Measured against Vertex on eight pages of a scanned Arabic question bank:
    #   1 worker   6.9s/page
    #   8 workers  1.6s/page, 8/8 answered, no rate limiting   <- picked
    # 4.2x, not the 8x the number suggests: concurrent requests are each a
    # little slower. Rendering stays on one thread either way — a PyMuPDF
    # Document is not thread-safe, and two threads rendering from one is a
    # crash rather than a slow path. 1 turns this off.
    page_workers: 8               # the only one implemented; any other value turns
                                 # page vision off and leaves the text layer alone
    # Reading a book into the page cache before the pipeline walks it
    # (ingestion/read_ahead.py): each page rendered once, on every core, and
    # both of its model calls made from that one image. Measured over twenty
    # pages of a scanned 1033 x 1375 pt textbook at 300 dpi on an idle 2-vCPU
    # machine: 0.83s a page on one thread — and the pipeline rendered each page
    # twice — against 0.45s a page through two processes.
    read_ahead:
      enabled: true
      # Model calls in flight from one machine. Twice page_workers because a
      # worker here makes a page's two calls one after the other. Not yet swept
      # at this width: 24 in flight against one Vertex quota measured seven
      # 429s over 22 minutes, every one absorbed by vision.retry_attempts, and a
      # page that still fails is read by the pipeline afterwards rather than
      # lost. Lower it before raising retry_attempts if a run is rate limited.
      workers: 16
      render_processes: 0         # 0 = one per CPU
    garbage:                    # legibility gate: glyph-noise digital pages -> vision
      symbol_ratio: 0.45         # non-alphanumeric share above this: symbol-junk (any length)
      word_check_min_chars: 80   # run the word check only past this length
      min_word_hits: 3           # Latin page below this many common-word hits: cipher garbage
      stopwords:                 # per-language common words; symbol check needs none
        ar: [في, من, على, التي, كان, إلى, هذا, عن, مع, أن]
        en: [the, of, and, is, to, in, a, are, for, with, that]
        fr: [le, la, les, de, et, un, une, des, est, dans, que]
        de: [der, die, und, ist, den, das, mit, für, ein, eine, im]
  figures:
    extract_embedded: true
    min_width_px: 120
    min_height_px: 120
    max_page_area_ratio: 0.6     # larger share of the page than this: not a figure
    max_identical_sizes_per_page: 8   # more same-sized images: scan tiles, skip
    dedupe_overlap: 0.7          # same figure embedded twice: drop the lower-res copy
    vision_fill_math: true       # math pages: add vision-detected figures get_images missed
                                 # (vector geometry diagrams); deduped against get_images
    generate_alt_text: true

language:
  supported: [ar, en, fr, de]   # answered in. Others are recognised and fall back —
                                # see _ALSO_RECOGNISED in shared/language/detect.py.
                                # Adding one here also needs its strings in catalog.py
  default: en
  arabic_ratio: 0.30           # >= this share of Arabic-script letters -> the turn is Arabic
  # Detection decides a turn only with enough evidence: below any of these it
  # declines and the resolver falls back to what it already knew. "explain column
  # subtraction" scored 0.57 for French under the old detector — exactly the kind
  # of guess these floors exist to reject.
  min_chars: 12
  min_confidence: 0.55
  min_margin: 0.15
  verify:
    enabled: true
    min_confidence: 0.60
    answer_min_chars: 40
  quiz_single_language: true   # questions follow the subject; prose follows the student
  reply_follows: subject

database:
  # Postgres has no default timeout of its own: an unresponsive host holds the
  # connection open until the caller gives up, which for a student's turn means
  # the HTTP client's limit. Measured against the production instance from
  # outside the VPC: connect 486ms, the heaviest read (every topic label plus
  # its 1024-dimension embedding) 554ms, chunk and prerequisite reads ~65ms.
  # These are roughly 10x the measured worst case — wide enough for a corpus
  # several times the size, narrow enough that a hang is an error, not a wait.
  connect_timeout_seconds: 5
  statement_timeout_ms: 5000

  # Connections are pooled and reused. Opening one costs a 486ms handshake
  # against a read that takes 65ms, so an unpooled turn spent 86% of its
  # database time saying hello — and two overlapping turns opened two.
  #
  # These come from a sweep, 8 concurrent reads against production, ms:
  #
  #                              median   p95   worst
  #   a connection per call         650   719     723
  #   pooled min=0, checked         243   474     603
  #   pooled min=4, unchecked       177   350     408
  #   pooled min=8, checked         235   239     246   <- this
  #
  # The unchecked pool has the better median and a tail three times as wide.
  # Predictable beats fast here: an intermittent 500 is what sent us looking.
  # min == max, so the pool is full and a burst never pays for a handshake;
  # a 9th caller waits a bounded pool_wait_seconds rather than opening a 9th.
  #
  # The pool is built the first time something asks for a connection, never at
  # import — /health and /ready touch no database, so a probe cannot build it.
  pool_size: 8                 # per process; ECS runs one pool per task
  pool_wait_seconds: 5         # waiting for a free connection is a bounded error, not a hang
  pool_max_lifetime_seconds: 900   # recycle, so a connection the server has since dropped is not held forever
  # One round trip per checkout to prove the connection is alive. It is the
  # difference between p95 239ms and p95 350ms, and it is what stops a
  # connection the server dropped from failing inside a student's turn.
  pool_check_connections: true
  # A pooled socket can die while idle without a reset: a NAT or firewall drops
  # the flow, a failover moves the host. statement_timeout cannot help, because
  # the server never sees the query; the check's SELECT 1 then waited until the
  # 120s turn limit and every database request answered 504 until a restart.
  # Keepalives find a socket that died idle within idle + interval x count
  # (35s); tcp_user_timeout fails a send nobody acknowledges within 15s. Both
  # are bounded by the turn rather than swept: well under api.request_timeout,
  # and far above the 486ms handshake a replacement connection costs.
  keepalives_idle_seconds: 20
  keepalives_interval_seconds: 5
  keepalives_count: 3
  tcp_user_timeout_ms: 15000

agent:
  # Retrieval is two-stage. A dense search finds candidates; BM25 over those same
  # candidates reorders them, and the two rankings are fused by reciprocal rank.
  #
  # A single dense vector summarises a chunk's meaning, and a summary loses the
  # name a question often turns on. Five Grade 7 lessons about success and youth
  # sit almost on top of each other in the embedding space — their top scores for
  # "قصيدة الشباب لإيليا أبو ماضي" were within 0.04 — so the right lesson came
  # second or third. Measured on the 14-query golden set: dense alone 10/14 at
  # precision@1, hybrid 13/14, and the three it fixes are exactly the title and
  # proper-name queries. A BAAI/bge-reranker-v2-m3 cross-encoder was measured on
  # the same set for comparison: 11/14, for 1.8s a query. This costs ~1ms and no
  # model. Declines are unaffected: min_score is still applied to the dense
  # cosine, which the fusion does not touch.
  hybrid:
    enabled: true
    candidates: 50             # dense hits reordered; the lexical stage cannot
                               # recover what the dense stage never returned
    rrf_k: 60                  # Cormack et al.'s published constant

  # Whether an explanation may teach what the lessons leave out, when the turn
  # reading places the question inside the subject: the basics a lesson assumes,
  # an earlier step, a fuller worked example. The tutor says that part goes
  # beyond the lesson and cites nothing for it; a question outside the subject is
  # still declined, and a summary never leaves the material. false restores the
  # lesson-only tutor, which told a maths student asking for subtraction "from the
  # very beginning" that their lessons had nothing on it.
  beyond_lessons: true

  scope:
    # When the student has selected one lesson, the turn answers from that lesson
    # or refuses by name. The similarity floor cannot make that call: filtered to
    # a single lesson there is nothing to lose to, so its best chunk clears the
    # floor whatever was asked — "explain the Youth poem" scores 0.503 against the
    # Jabir lesson, against 0.472 for "who was Jabir ibn Hayyan".
    #
    # The rest of the corpus is what separates them. Measured over 15 questions
    # across three lessons, as the scoped best score over the unscoped best:
    #   in-scope      0.952 - 1.000
    #   out-of-scope  0.324 - 0.872
    # At 0.90 all 7 in-scope questions are answered and all 8 out-of-scope ones
    # refused. Costs one extra vector search (~100ms) and no model call.
    #
    # It cannot catch a question the corpus answers nowhere: "اشرح لي الطرح" is
    # answered inside every Arabic lesson because the only subtraction material
    # indexed is two English paragraphs, so no lesson answers it better and the
    # ratio is 1.0. That is a gap in the corpus, not in the rule — it closes when
    # the real curriculum is indexed. Re-measure then.
    relevance_ratio: 0.90

  conversation:
    store: postgres
    ttl_hours: 720
    # Measured over the 93 conversation turns in production (Arabic, English and
    # French): a turn runs to a median of 705 characters and 1305 at p90 — 203
    # and 376 tokens. The bounds these replace were 6 turns within 6000
    # characters, and on any conversation above the median the character bound
    # bit first: six p90 turns is 7830 characters, so the window handed over
    # four turns while its name promised six.
    #   6 turns  @ p90 = 2256 tokens
    #  12 turns  @ p90 = 4512 tokens   <- picked; the turn count binds, not the budget
    #  24 turns  @ p90 = 9024 tokens
    recent_turns: 12
    fold_after: 24
    history_tokens: 6000       # backstop on the quoted window, not the policy
    reply_tokens: 600          # p90 reply is 342 tokens; this clips the longest ~5%
    # How much raw conversation a fold can still reread. Under this the summary
    # is rewritten from what was said; over it, from the previous summary, and
    # detail starts decaying. ~60 turns at the median.
    rebuild_tokens: 12000
    connect_timeout_seconds: 2
    statement_timeout_ms: 500
    failure_threshold: 3
    breaker_seconds: 30
  # Runtime graph (read-only). Retrieval breadth, prerequisite walk, loop backstop.
  k: 8                       # chunks retrieved per explain/summarize turn
  min_score: 0.47            # retrieval similarity floor; below this a chunk is off-syllabus -> decline.
                             # Re-swept after the context prefix went on: embedding a chunk
                             # with its subject, lesson, section and page lifts every score a
                             # little, the unanswerable ones with the rest, and 0.44 stopped
                             # separating them — "اشرح لي قانون نيوتن الأول" rose from 0.434 to
                             # 0.444 and was answered from a lesson about electronic games.
                             # Over the same 12 answerable and 10 unanswerable questions,
                             # against the dense+sparse index:
                             #   0.44 -> 11/12 answered,  8/10 declined
                             #   0.45 -> 11/12 answered,  9/10 declined
                             #   0.46 -> 11/12 answered, 10/10 declined   <- the knee
                             #   0.47 -> 11/12 answered, 10/10 declined   <- picked, for margin
                             #   0.52 -> 11/12 answered, 10/10 declined
                             # 0.47 sits 0.02 above the best unanswerable (0.450) and 0.03
                             # below the worst answerable (0.500), rather than on the knee.
                             # The sweep below is the one that set 0.44, kept because it is
                             # why the floor is not 0.50:
                             # 0.50 was swept against same-language questions only, and a
                             # cross-lingual question scores systematically lower: the same
                             # lesson answers "ماذا اخترع جابر بن حيان؟" at 0.600 and "what did
                             # Jabir ibn Hayyan invent?" at 0.455. One absolute cosine over two
                             # different distributions declined material that plainly exists —
                             # an English question about an Arabic lesson was answered "not in
                             # the syllabus" while the Arabic form of it was answered.
                             # Re-swept over 13 questions the syllabus can answer (Arabic,
                             # English, and English/French/German asked of Arabic lessons) and
                             # 12 it cannot:
                             #   0.50 ->  6/13 answered, 12/12 declined
                             #   0.46 ->  9/13 answered, 11/12 declined
                             #   0.44 -> 13/13 answered, 10/12 declined   <- the knee
                             #   0.42 -> 13/13 answered,  7/12 declined
                             #   0.40 -> 13/13 answered,  6/12 declined
                             # The two that reach the model at 0.44 are handled by the second
                             # gate: an answer that cites nothing is published as a decline
                             # (explain_summarize_sg._finalize), so a passage that does not
                             # answer the question cannot become an answer. A score floor
                             # cannot make that judgement — "ما معنى التسويف؟" retrieves the
                             # chunk containing the word at 0.451 and the lesson never defines
                             # it, which is a reading question, not a geometry one.
                             # Only this low because matching folds Arabic (shared/matching.py)
                             # and retrieval fuses a lexical rank (shared/lexical.py).
                             # Re-sweep when the real curriculum is indexed.
  topic_filter: "off"        # explain/summarize/report: off = rank by similarity alone; soft = a topic-filtered miss retries unscoped
                             # (a wrong topic guess must not silently exclude the material); hard = strict
                             # (assessment stays hard — it wants one topic per question)
  resolve_topics_qdrant: true   # topic resolution via the Qdrant topics collection.
                                # The Postgres path is a pure-Python O(N) cosine that streams
                                # every label vector over the wire, on every question — measured
                                # at 1648 ms/call against 487 ms indexed, for identical results.
                                # It also grows with the catalogue while the indexed path does
                                # not. Populate the collection with scripts/reembed_chunks.py
                                # before turning this on.
  prereq_depth: 2            # prerequisite hops resolve_prereqs walks (<= 2)
  expand:
    anchors: 3
    window: 2
    context_limit: 14
  show_prereqs: true         # append "you should know X first" to an answer. The labels
                             # come from topic extraction at ingest, so the line is only as
                             # good as those are — turn it off if they read as noise.
  max_prereqs: 5             # nearest prerequisite topics kept from that walk; the rest
                             # would outweigh the lesson the student actually asked about
  max_citations: 6           # sources published per turn; markers beyond this are dropped
  explain_figures: false     # emit an auto math figure from explain/summarize (math subjects). Off for now
  recursion_limit: 25        # LangGraph backstop
  infer_subject_k: 5         # top-k topics considered when inferring a subject, filtered to enrolled
  default_subject_id: null   # fallback subject when a request/demo omits it
  default_tasks: [explain, summarize]
  pathways:                  # task allowlist per pathway
    student: { tasks: [explain, summarize, assessment, grade, visual, report] }
    teacher: { tasks: [explain, summarize, assessment, grade, visual] }   # teacher/parent report scopes are Sprint 3 (classroom/parent)
    parent:  { tasks: [explain, summarize, visual] }   # progress reports land with report_sg
  backend:                   # backend read-client (HTTP when BACKEND_API_BASE_URL set)
    fixtures_path: null       # local agent fixtures manifest for offline runs
    prefer_fixtures: false    # force fixtures even when a base URL is set (local overlay: true)
    timeout: 30
    max_retries: 3

assessment:
  # Assessment generation (assessment_sg) — quiz, homework, exam, practice; the KIND is
  # the caller's save-target, the generation is one engine. GENERATED is the default
  # source; BANK/HYBRID are built but off (bank is ~80% AI-generated, no quality gain).
  item_source: generated       # generated | bank | hybrid
  type_mix: { mcq: 3, true_false: 1, short_answer: 1, essay: 0 }  # count = sum
  difficulty: mixed
  adaptive: true               # weight weak topics via get_mastery
  k_per_topic: 4               # chunks retrieved per covered topic
  max_count:                   # cap on a requested question count, by role (a teacher's
    student: 20                # final exam can be large; a student self-test stays small
    teacher: 200

grade:
  # Grading (grade_sg). AI-final: mastery moves whenever the AI grades
  # (no teacher-approval gate); a teacher edit later is a correction appended as a new
  # mastery_event. `source` maps the grading context to the mastery_event_source enum.
  source: practice             # practice | quiz | homework — default for a chat grade turn
  pass_threshold: 0.5          # partial_score >= this counts as 'correct' for mastery
  # Grounding priority: a key/rubric is used FIRST; RAG grounds ONLY a keyless answer (fallback).

tagging:
  # Topic suggestions for teacher-written questions (agent/tagging.py). The threshold is
  # the one grading already resolves a submission's topic with, so a suggested topic is
  # the topic grading would have picked.
  k: 3
  threshold: 0.40

recommend:
  # What to practise next (agent/recommend.py). Starting values, not yet swept: they
  # order a student's list, they do not decide mastery. Revisit with real evidence.
  limit: 5
  stale_days: 14        # untouched this long adds the full neglect weight
  stale_weight: 0.15    # a 0.40 topic left a month ranks below a 0.20 topic seen yesterday
  prereq_weight: 0.2    # a weak prerequisite is reviewed before the topic built on it

learner_summary:
  # The student analysis (agent/analytics.py): how much of each list a homepage gets.
  strengths_limit: 5
  weaknesses_limit: 5
  not_practised_limit: 5
  recent_per_topic: 5   # latest answers per topic behind "missed 2 of the last 3"
  activity_weeks: 8     # weeks of answered-question history in the activity series
  mistakes_limit: 3
  review_limit: 5
  mistake_window_days: 60  # mistake patterns are read over this window

class_analytics:
  # A teacher's view of one class (agent/class_analytics.py). Starting values, not yet
  # swept: they decide who is flagged for the teacher's attention, not any student's mastery.
  at_risk_weak_share: 0.4   # weak on this share of judged topics flags the student
  at_risk_min_judged: 3     # below this many judged topics the share is not trusted
  inactive_days: 14         # no graded answer for this long flags the student
  history_per_student: 20   # latest answers per student behind the trend direction
  window_days: 30           # mistakes and missed questions are counted over this window
  mistakes_limit: 5
  most_missed_limit: 5
  at_risk_limit: 10
  max_students: 500         # a roster larger than this is refused rather than slowly read
  engagement_days: 7        # "active" means a graded answer within this many days
  min_group: 2              # students weak on one topic before they are suggested as a group
  groups_limit: 5

persona:
  enabled: false
  store: postgres
  cache_ttl_seconds: 300
  examples_per_turn: 3
  max_exemplars: 40
  min_passages: 5
  min_passage_chars: 120
  max_passage_chars: 1200
  max_prompt_chars: 300
  max_source_chars: 200000
  card_sample_chars: 24000
  selection_sample_chars: 40000
  build_timeout_seconds: 300

voice:
  transcribe:
    url: https://api.elevenlabs.io/v1/speech-to-text
    model: scribe_v2
    api_key_env: ELEVENLABS_API_KEY
    provider_logging: true
    usd_per_minute: 0.0037
    timeout_seconds: 60
    max_upload_bytes: 10000000
  speak:
    enabled: false
    url: https://api.elevenlabs.io/v1/text-to-speech
    model: eleven_flash_v2_5
    api_key_env: ELEVENLABS_API_KEY
    provider_logging: true
    output_format: mp3_44100_128
    content_type: audio/mpeg
    usd_per_million_chars: 40
    max_chars: 3000
    script_max_growth: 4
    timeout_seconds: 30
    voices:
      ar: EXAVITQu4vr4xnSDxMaL
      en: EXAVITQu4vr4xnSDxMaL
      fr: EXAVITQu4vr4xnSDxMaL
      de: EXAVITQu4vr4xnSDxMaL

render:
  # Deterministic educational visuals (agent/render.py) -> uploader -> ai.artifacts.
  # User-agnostic: student, teacher and parent all use the same renderers.
  chart: { width: 8.0, height: 5.0, dpi: 120 }   # matplotlib figure size (inches) + dpi
  mindmap: { width: 900, height: 600 }           # SVG canvas (px)
  pdf: { page: A4 }
  flashcards: { count: 8 }                        # cards a topic-built (no-quiz) flashcard set targets
  math: { samples: 200 }                          # points sampled per function when plotting expr+domain
  slides: { max_slides: 10 }                      # cap on a generated slide outline (consolidate, stay digestible)
  max_per_turn: 3                                # visual_sg caps how many visuals a turn renders
  figures_with_explain: false                    # an explanation also surfaces the lecture's figure (off: only explicit visual requests)

image_gen:
  # Provider-agnostic illustrative image generation. Real provider used when its key is
  # in .env; otherwise falls back to a deterministic stub with a WARNING (never silent).
  provider: openai             # openai | stub
  model: gpt-image-1
  size: "1024x1024"

storage:
  key_prefix: ai-artifacts

mastery:
  # Difficulty-weighted EMA rollup (agent/mastery.py). alpha = weight of the newest
  # observation; difficulty scales it so harder items move mastery more. A topic
  # under min_attempts reads as 'unknown' (confidence < 1), never 'weak'.
  alpha: 0.4
  # Asymmetric by outcome: a hard item answered RIGHT is strong evidence of mastery; an
  # easy item answered WRONG is strong evidence of a gap — easy-right / hard-wrong barely
  # move the needle. Picked by whether the observation is above/below neutral (0.5).
  difficulty_weights:
    correct:   { easy: 0.7, medium: 1.0, hard: 1.3 }
    incorrect: { easy: 1.3, medium: 1.0, hard: 0.7 }
  min_attempts: 2
  strong_threshold: 0.75
  weak_threshold: 0.45
  retention:
    # How long a topic stays remembered (agent/mastery.py). Starting values, not yet
    # swept: with these, a topic at 0.85 over 3 assessments is due for review 3 days
    # after the last one, and over 6 assessments 10 days after.
    base_stability_days: 7.0
    growth: 1.5
    max_stability_days: 180.0
    target: 0.8

report:
  # Student-progress reporting (report_sg). weak_topic_limit caps how many weak topics
  # a report addresses; prereq_depth is the prerequisite hops root-cause walks (deepest
  # weak prereq = the cause, not the symptom).
  weak_topic_limit: 5
  strength_limit: 3   # strong topics a note may praise
  prereq_depth: 2
  trend:
    window: 50        # newest N mastery_events read for the trend
    min_events: 4     # below this the trend direction is 'insufficient'
    flat_band: 0.05   # |late-mean - early-mean| within this reads as 'flat'

backend:
  # Resolver uses the backend API when BACKEND_API_BASE_URL is set, else this
  # local fixtures manifest (or --fixtures).
  fixtures_path: null

api:
  # HTTP service (system/). Secrets stay in .env; everything tunable is here.
  max_concurrency: 8           # concurrent graph invocations; each holds a worker thread
  request_timeout: 120         # seconds a caller should allow for a chat turn
  docs_enabled: true           # OpenAPI + /docs; off in production
  cors_origins: []             # the platform backend calls this service, not a browser
  homework:
    # A phone photo of one page. Above this the upload is refused with a size
    # error rather than spending a vision call on it: a 12 MP camera JPEG is
    # around 4 MB, and anything much larger is a scan of a whole booklet, which
    # is an ingestion job rather than a homework question.
    max_upload_bytes: 8388608
  ingestion:
    max_workers: 2             # concurrent pipeline runs (each is minutes long and heavy)
    job_retention: 500         # in-process job records kept for status polling
    callback_enabled: true     # PATCH lesson ingestion_status back to the platform
    callback_path: /lessons/{lesson_id}/ingestion   # platform contract (content.ingestion_status)


logging:
  level: INFO
  format: json
  third_party_level: WARNING   # cap HTTP/LLM client loggers so a DEBUG app level
                               # never logs request/response bodies (prompts, PII)
  file: null
  file_max_bytes: 10000000

# Overlays merged over the base, selected by APP_ENV.
credits:
  # Off until the backend's Prisma migrations create ai.credit_wallets and
  # ai.credit_ledger (docs/BACKEND_INTEGRATION.md, "Credits"). Enabled against a
  # database without them, every paid request is refused with 503.
  enabled: false
  store: postgres              # postgres | memory
  connect_timeout_seconds: 2
  statement_timeout_ms: 1000
  default_plan: free
  plans:
    free:  { monthly_credits: 50 }
    basic: { monthly_credits: 500 }
    pro:   { monthly_credits: 2000 }
  # One credit is sized to the dearest ordinary chat turn. Estimated on
  # 2026-09-29 from token counts and OpenRouter prices (gemini-2.5-flash $0.30/M
  # in, $2.50/M out), not measured: a chat turn $0.004-0.011, a grading batch of
  # ten answers about one explain turn. Every usage entry stores what OpenRouter
  # billed (cost_usd), which is the evidence these must be re-set from.
  prices:
    chat_message:     { credits: 1, per: 1 }
    grade_answers:    { credits: 1, per: 10 }
    student_report:   { credits: 1, per: 1 }
    class_report:     { credits: 2, per: 1 }
    homework_capture: { credits: 1, per: 1 }
    persona_build:    { credits: 5, per: 1 }
    voice_transcribe: { credits: 1, per: 1 }
    voice_speak:      { credits: 1, per: 1 }

environments:
  local:
    logging: { level: DEBUG, format: console }
    vector_store: { collection: eduai_chunks_dev, topics_collection: eduai_topics_dev }   # keep dev index off prod
    # Local talks to the real backend when BACKEND_API_BASE_URL is set. For offline
    # work, point fixtures_path at a manifest and flip prefer_fixtures.
    agent: { backend: { fixtures_path: null, prefer_fixtures: false } }
    credits: { store: memory }
    persona: { store: memory }


  production:
    api: { docs_enabled: false }
    # INFO: at WARNING a turn's lifecycle (mastery written, reports stored, degraded
    # reads' counts) never reached CloudWatch, so a working grade and one that moved
    # nothing looked the same from outside.
    logging: { level: INFO }
    llm: { max_retries: 5 }
