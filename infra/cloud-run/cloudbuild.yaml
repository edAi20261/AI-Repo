# Builds the ingestion image (Dockerfile.ingest) in Google Cloud, not on a
# laptop: torch and the baked embedder are gigabytes.
#
#   gcloud builds submit --config infra/cloud-run/cloudbuild.yaml \
#     --substitutions _IMAGE=REGION-docker.pkg.dev/PROJECT/ingest/ingest:TAG .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.ingest", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
