name: Deploy to ECS

on:
  push:
    branches: [main]
  # The lint and test job only ever ran after a merge, so "no new lint findings"
  # and every contract test were gates on the deploy rather than on the change.
  # A broken PR reached main before anything objected.
  pull_request:

permissions:
  id-token: write # required for OIDC — do not add contents:write etc. beyond what's needed
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      QDRANT_URL: ":memory:"
      AI_WEBHOOK_SHARED_SECRET: "test-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Lint is a gate, not a suggestion. The rules this project enforces are in
      # pyproject.toml, with the backlog listed rather than deleted so it can
      # only shrink.
      - name: Lint
        run: python -m ruff check agent shared system ingestion scripts tests
      - run: python -m pytest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Debug - decode actual OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::649631967545:role/edu-ai-github-actions-ai-service
          aws-region: eu-central-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: edu-ai-ai-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster edu-ai-ai \
            --service edu-ai-ai-service \
            --force-new-deployment \
            --region eu-central-1

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster edu-ai-ai \
            --service edu-ai-ai-service \
            --region eu-central-1
