name: Deploy to ECS

on:
  push:
    branches: [main]
  # The lint and test job only ever ran after a merge, so "no new lint findings"
  # and every contract test were gates on the deploy rather than on the change.
  # A broken PR reached main before anything objected.
  pull_request:

permissions:
  id-token: write # required for OIDC — do not add contents:write etc. beyond what's needed
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Lint is a gate, not a suggestion. The rules this project enforces are in
      # pyproject.toml, with the backlog listed rather than deleted so it can
      # only shrink. verify.py is also the developer agent's stop gate, so what
      # it runs — lint paths and the test environment — is decided there alone.
      - name: Lint and test
        run: python scripts/verify.py

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Debug - decode actual OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::649631967545:role/edu-ai-github-actions-ai-service
          aws-region: eu-central-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      # ECS is moving this service onto Graviton (ARM64); every dependency in
      # requirements.txt ships linux/aarch64 wheels for Python 3.11, so the
      # image itself needs no change, only a multi-arch manifest. QEMU runs
      # the arm64 leg under emulation (GitHub-hosted runners are x86_64 only)
      # — noticeably slower here because the Dockerfile bakes in the 2GB
      # BGE-M3 embedder at build time, not because of anything arm64-specific.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: edu-ai-ai-service
          IMAGE_TAG: ${{ github.sha }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster edu-ai-ai \
            --service edu-ai-ai-service \
            --force-new-deployment \
            --region eu-central-1

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster edu-ai-ai \
            --service edu-ai-ai-service \
            --region eu-central-1

  # The ingestion image carries the layout models — gigabytes the service image
  # must never pay for at start-up. It is built on the same commit and run as a
  # task when a book is ingested, so it is deployed by existing, not by rolling.
  ingest-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::649631967545:role/edu-ai-github-actions-ai-service
          aws-region: eu-central-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Make room for the models
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Build and push the ingestion image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: edu-ai-ingest
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.ingest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
