name: Deploy to ECS

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC — do not add contents:write etc. beyond what's needed
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::649631967545:role/edu-ai-github-actions-ai-service
          aws-region: eu-central-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: edu-ai-ai-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster edu-ai-ai \
            --service edu-ai-ai-service \
            --force-new-deployment \
            --region eu-central-1

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster edu-ai-ai \
            --service edu-ai-ai-service \
            --region eu-central-1
