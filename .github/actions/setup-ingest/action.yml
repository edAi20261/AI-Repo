name: Set up the ingestion runtime
description: >
  Python 3.11 and the pipeline's dependencies, restored from cache when
  requirements.txt has not changed — and, when asked, the embedding model.
inputs:
  model:
    description: Also make the embedding model available, offline.
    default: "false"
runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # The whole environment, not pip's download cache: installing torch and
    # transformers from wheels already on disk still takes minutes, and every
    # job of a run would pay them.
    - id: venv
      uses: actions/cache@v4
      with:
        path: ~/.venv-ingest
        key: venv-ingest-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

    - if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv ~/.venv-ingest
        ~/.venv-ingest/bin/pip install --no-compile --quiet \
          --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
        ~/.venv-ingest/bin/pip install --no-compile --quiet -r requirements.txt

    - shell: bash
      run: echo "$HOME/.venv-ingest/bin" >> "$GITHUB_PATH"

    # Keyed on the model's name rather than on config.yaml, which changes for
    # every other reason too and would send each change to Hugging Face for
    # gigabytes it already has.
    - if: inputs.model == 'true'
      id: model-name
      shell: bash
      run: |
        name=$(python -c "from shared.config import get_config; \
          print(get_config().get('embeddings.model'))")
        echo "name=${name//\//-}" >> "$GITHUB_OUTPUT"

    - if: inputs.model == 'true'
      id: model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-${{ steps.model-name.outputs.name }}

    # Loaded the way the pipeline loads it, so the cache holds exactly the files
    # the pipeline reads — and nothing a separate download would also fetch.
    - if: inputs.model == 'true' && steps.model.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -c "from shared.config import get_config; \
          from shared.embeddings import get_embedder; get_embedder(get_config())"

    # With the weights on disk the library still asks the network whether they
    # are current; offline, the copy here is the only one it looks for.
    - if: inputs.model == 'true'
      shell: bash
      run: echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"
